cargo-features = ["codegen-backend"]

[package]
name = "site"
version = "0.1.0"
edition = "2021"

[package.metadata.leptos]
output-name = "site"
site-root = "target/site"
site-pkg-dir = "pkg"
# Assets source dir. All files found here will be copied and synchronized to site-root. //NB: The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
assets-dir = "public"

site-addr = "127.0.0.1:61156"
reload-port = 61157

# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

env = "DEV" # "DEV" | "PROD"

bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

lib-profile-release = "wasm-release"

[package.metadata.cargo-all-features]
skip_feature_sets = [["ssr", "hydrate"]]

# Reached only through a macro expansion, so no `use` of it exists to find.
[package.metadata.cargo-machete]
ignored = ["miette"]

[workspace]
members = [".", "crates/va_sso"]

[workspace.lints.rust]
unused_features = "allow"

[workspace.dependencies]
any_spawner = "=0.3.0"
axum = "=0.8.9"
base64 = "=0.22.1"
bcrypt = "=0.19.2"
clap = "=4.6.2"
color-eyre = "=0.6.5"
console_error_panic_hook = "=0.1.7"
derive-new = "=0.7.0"
derive_more = "=2.1.1"
dockviewers = "0.2.1"
ed25519-dalek = "2"
exchange_interactions = "=0.19.2"
futures = "=0.3.32"
gloo-net = "=0.6.0"
gloo-timers = "=0.4.0"
jiff = "=0.2.32"
js-sys = "=0.3.103"
jsonwebtoken = { version = "11.1", default-features = false }
leptos = "=0.8.20"
leptos-routable = { git = "https://github.com/stefanboere/leptos-routable" }
leptos_axum = "=0.8.10"
leptos_meta = "=0.8.6"
leptos_router = "=0.8.14"
lettre = "=0.11.22"
miette = "=7.6.0"
notify = "=8.2.0"
oauth2 = "=5.0.0"
reqwest = "=0.12.28"
send_wrapper = "=0.6.0"
serde_json = "=1.0.150"
serde_with = "=3.21.0"
sqlx = "0.9"
tokio = "=1.53.1"
tower-http = "=0.7.0"
tracing = "=0.1.44"
trading_data_core = "=0.3.0"
url = "=2.5.8"
uuid = "=1.24.0"
v_utils = "=2.17.12"
va_sso = { version = "0.1", path = "crates/va_sso" }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = "=0.3.103"
xdg = "=3.0.0"

[lib]
crate-type = ["cdylib", "rlib"]
#,}}}

[features]
# ssr + hydrate are mutually exclusive (see skip_feature_sets); plain `cargo r/b` must pick one.
# cargo-leptos overrides via bin-/lib-features, so this only governs bare cargo → server target.
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:gloo-timers",
    "dep:gloo-net",
    "dep:serde_json",
    "dep:send_wrapper",
]
ssr = [
    "dep:any_spawner",
    "dep:serde_json",
    "dep:exchange_interactions",
    "dep:axum",
    "dep:tokio",
    "dep:tracing",
    "dep:leptos_axum",
    "dep:reqwest",
    "dep:sqlx",
    "dep:bcrypt",
    "dep:uuid",
    "dep:tower-http",
    "dep:lettre",
    "dep:oauth2",
    "dep:xdg",
    "dep:notify",
    "dep:miette",
    "dep:url",
    "dep:va_sso",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }

any_spawner = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64.workspace = true
bcrypt = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"] }
color-eyre.workspace = true
console_error_panic_hook = { workspace = true, optional = true }
derive-new.workspace = true
derive_more = { workspace = true, features = ["from", "display", "deref", "deref_mut", "debug"] }
dockviewers = { workspace = true, features = ["leptos"] }
exchange_interactions = { workspace = true, features = ["binance", "bybit", "data"], optional = true }
futures.workspace = true
gloo-net = { workspace = true, features = ["http"], optional = true }
gloo-timers = { workspace = true, features = ["futures"], optional = true }
jiff = { workspace = true, features = ["serde", "tzdb-bundle-always"] } # bundle IANA tzdb into the binary — prod container ships no system tzdata
js-sys.workspace = true
leptos = { workspace = true, features = ["islands"] }
leptos-routable.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_meta.workspace = true
leptos_router.workspace = true
lettre = { workspace = true, features = ["tokio1-native-tls", "builder"], optional = true }
miette = { workspace = true, features = ["fancy"], optional = true }
notify = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true } # pinned to 0.12: oauth2 5.0 has not migrated to reqwest 0.13 (its `request_async` only accepts its own reqwest 0.12 client type)
send_wrapper = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_with.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
tower-http = { workspace = true, features = ["fs", "compression-gzip"], optional = true }
tracing = { workspace = true, optional = true }
trading_data_core.workspace = true # `Pair` et al., moved out of v_utils in 2.16; version matched to exchange_interactions' own
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
v_utils = { workspace = true, features = ["cli", "xdg", "lightweight_charts"] }
va_sso = { workspace = true, optional = true }
wasm-bindgen.workspace = true #NB: version must match that of wasm-bindgen-cli (pinned in flake.nix)
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Navigator", "Clipboard", "Document", "Element", "HtmlElement", "HtmlInputElement", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Storage"] }
xdg = { workspace = true, optional = true }

# v_utils 2.15.47 pulls `ustr` -> `ahash` -> `getrandom 0.3` unconditionally; on wasm getrandom needs its `wasm_js` backend feature (+ the cfg in .cargo/config.toml)
[target.wasm32-unknown-unknown.dependencies]
# Both majors reach wasm and features do not unify across them, so each needs its own
# `wasm_js`: 0.3 via ahash, 0.4 via leptos/uuid. Renamed because one section cannot name
# the same crate twice; nothing imports the 0.4 alias, it exists to carry the feature.
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[[example]]
name = "test"
path = "./examples/test.rs"

[lints.rust]
unused_features = "allow"

[lints.clippy]
# `derive_new::new` expands to `Self { field: field, .. }` at each of its nine sites here, and the
# lint cannot tell generated code from hand-written.
redundant_field_names = "allow"
